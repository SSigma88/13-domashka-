<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДЗ 13 - Тест AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <script>
        AFRAME.registerComponent('ar-tap-placer', {
            init: function () {
                const sceneEl = this.el;
                const models = ['#avatarModel', '#glasses1Model', '#glasses2Model'];

                sceneEl.addEventListener('enter-vr', () => {
                    if (!sceneEl.is('ar-mode')) return;

                    const session = sceneEl.xrSession;
                    session.addEventListener('select', () => {
                        const reticle = document.querySelector('#ar-reticle');

                        if (reticle && reticle.getAttribute('visible')) {
                            const newModel = document.createElement('a-entity');
                            const randomIndex = Math.floor(Math.random() * models.length);
                            
                            newModel.setAttribute('gltf-model', models[randomIndex]);
                            
                            const position = reticle.object3D.position;
                            newModel.setAttribute('position', `${position.x} ${position.y} ${position.z}`);
                            newModel.setAttribute('scale', '0.2 0.2 0.2'); // Немного уменьшили масштаб

                            sceneEl.appendChild(newModel);
                        }
                    });
                });
            }
        });
    </script>

    <a-scene webxr="requiredFeatures: hit-test; optionalFeatures: dom-overlay; overlayElement: #overlay;" ar-tap-placer>
        
        <a-assets>
            <a-asset-item id="avatarModel" src="avatar.glb"></a-asset-item>
            <a-asset-item id="glasses1Model" src="glasses1.glb"></a-asset-item>
            <a-asset-item id="glasses2Model" src="glasses2.glb"></a-asset-item>
        </a-assets>

        <a-sky color="#ECECEC" ar-hidden-in-ar></a-sky>
        <a-box position="0 1 -3" rotation="0 45 0" color="#4CC3D9" shadow ar-hidden-in-ar></a-box>

        <a-entity id="ar-reticle" 
                  ar-hit-test="target: #ar-reticle;" 
                  geometry="primitive: ring; radiusInner: 0.04; radiusOuter: 0.06" 
                  material="color: #00FF00; shader: flat" 
                  rotation="-90 0 0"
                  visible="false">
        </a-entity>

        <a-camera position="0 1.6 0"></a-camera>
        
    </a-scene>

    <div id="overlay" style="position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; pointer-events: none;">
    </div>

</body>
</html>
