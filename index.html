<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДЗ 13 - Налагодження AR</title>
    
    <script>
        window.onerror = function (message, url, line) {
            const logZone = document.getElementById('debug-log');
            if (logZone) {
                logZone.innerHTML += `<p style="color: #ff4d4d; margin: 5px 0; border-left: 3px solid #ff4d4d; padding-left: 5px;">❌ Помилка: ${message} (Рядок: ${line})</p>`;
            }
            return false;
        };
    </script>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden; background-color: #111;">

    <div id="debug-log" style="position: absolute; top: 0; left: 0; width: 100%; z-index: 99999; background: rgba(0, 0, 0, 0.9); color: #00ff00; font-family: monospace; font-size: 11px; max-height: 40vh; overflow-y: auto; padding: 10px; box-sizing: border-box; border-bottom: 2px solid #333;">
        <p style="color: #00ffff; margin: 0 0 5px 0;">🚀 Логер активовано. Очікування ініціалізації A-Frame...</p>
    </div>

    <script>
        // Реєстрація нашого компоненту для тапів
        AFRAME.registerComponent('ar-tap-placer', {
            init: function () {
                const sceneEl = this.el;
                const models = ['#avatarModel', '#glasses1Model', '#glasses2Model'];

                // Сповіщення в лог, що компонент успішно скомпілювався
                document.getElementById('debug-log').innerHTML += `<p style="color: #eee; margin: 2px 0;">• Компонент розстановки моделей готовий</p>`;

                sceneEl.addEventListener('enter-vr', () => {
                    if (!sceneEl.is('ar-mode')) return;

                    const session = sceneEl.xrSession;
                    session.addEventListener('select', () => {
                        const reticle = document.querySelector('#ar-reticle');

                        if (reticle && reticle.getAttribute('visible')) {
                            const newModel = document.createElement('a-entity');
                            const randomIndex = Math.floor(Math.random() * models.length);
                            
                            newModel.setAttribute('gltf-model', models[randomIndex]);
                            
                            const position = reticle.object3D.position;
                            newModel.setAttribute('position', `${position.x} ${position.y} ${position.z}`);
                            newModel.setAttribute('scale', '0.2 0.2 0.2');

                            sceneEl.appendChild(newModel);
                        }
                    });
                });
            }
        });
    </script>

    <a-scene webxr="requiredFeatures: hit-test;" ar-tap-placer>
        
        <a-assets>
            <a-asset-item id="avatarModel" src="avatar.glb"></a-asset-item>
            <a-asset-item id="glasses1Model" src="glasses1.glb"></a-asset-item>
            <a-asset-item id="glasses2Model" src="glasses2.glb"></a-asset-item>
        </a-assets>

        <a-sky color="#ECECEC"></a-sky>
        <a-box position="0 1 -3" rotation="0 45 0" color="#4CC3D9"></a-box>

        <a-entity id="ar-reticle" 
                  ar-hit-test="target: #ar-reticle;" 
                  geometry="primitive: ring; radiusInner: 0.04; radiusOuter: 0.06" 
                  material="color: #00FF00; shader: flat" 
                  rotation="-90 0 0"
                  visible="false">
        </a-entity>

        <a-camera position="0 1.6 0"></a-camera>
        
    </a-scene>

</body>
</html>
